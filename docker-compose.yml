services:
  install:
    image: oven/bun:1.3.14-alpine
    working_dir: /app
    command: sh -c 'bun install --frozen-lockfile || bun install --frozen-lockfile'
    volumes:
      - .:/app
      - dependencies:/app/node_modules
      - api-dependencies:/app/api/node_modules
      - web-dependencies:/app/web/node_modules
      - simulator-dependencies:/app/simulator/node_modules
  api:
    image: oven/bun:1.3.14-alpine
    working_dir: /app
    command: bun run --cwd api dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - dependencies:/app/node_modules
      - api-dependencies:/app/api/node_modules
      - ./config:/run/secrets:ro
      - ./data:/data
    env_file: .env
    environment:
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
      SQLITE_PATH: /data/kinan.sqlite
    depends_on:
      install:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    image: oven/bun:1.3.14-alpine
    working_dir: /app
    command: bun run --cwd web dev -- --host 0.0.0.0
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - dependencies:/app/node_modules
      - web-dependencies:/app/web/node_modules
    env_file: .env
    depends_on:
      install:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  dependencies:
  api-dependencies:
  web-dependencies:
  simulator-dependencies:
