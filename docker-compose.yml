x-logging: &default-logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }
services:
  redis:
    image: redis:7.4-alpine
    deploy:
      resources:
        limits:
          memory: 96M
    logging: *default-logging
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    expose: ['6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  mosquitto:
    image: eclipse-mosquitto:2.0.21
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *default-logging
    entrypoint: ['/mosquitto/config/entrypoint.sh']
    environment:
      MQTT_INGEST_USERNAME: ${MQTT_INGEST_USERNAME:-kinan-api}
      MQTT_INGEST_PASSWORD: ${MQTT_INGEST_PASSWORD:-REPLACE_WITH_LONG_RANDOM_PASSWORD}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/mosquitto/config/entrypoint.sh:ro
      - ./data/mosquitto:/mosquitto/auth
      - mosquitto-data:/mosquitto/data
    ports: ['127.0.0.1:1883:1883']
  api:
    build: { context: ., dockerfile: api/Dockerfile }
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging
    ports: ['127.0.0.1:3000:3000']
    user: '0:0'
    volumes: ['./data:/data', './data/mosquitto:/mosquitto-auth']
    env_file: .env
    environment:
      SQLITE_PATH: /data/kinan.sqlite
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://mosquitto:1883
      MOSQUITTO_PASSWORD_FILE: /mosquitto-auth/passwd
      MOSQUITTO_ACL_FILE: /mosquitto-auth/acl
      EXPORTER_URL: http://exporter:3100
      # localhost is canonical; permit 127.0.0.1 only as an explicit local alias.
      LOCAL_APP_ORIGINS: ${LOCAL_APP_ORIGINS:-http://127.0.0.1:5173}
    depends_on:
      redis: { condition: service_healthy }
      mosquitto: { condition: service_started }
      exporter: { condition: service_healthy }
  exporter:
    build: { context: ., dockerfile: exporter/Dockerfile }
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging
    user: '0:0'
    volumes: ['./data:/data']
    environment:
      EXPORTER_SQLITE_PATH: /data/kinan.sqlite
      EXPORTER_STORE_PATH: /data/exporter.sqlite
      EXPORTER_FILES_DIR: /data/exports
    expose: ['3100']
  web:
    build: { context: ., dockerfile: web/Dockerfile }
    deploy:
      resources:
        limits:
          memory: 48M
    logging: *default-logging
    ports: ['127.0.0.1:5173:8080']
    depends_on: [api]
volumes:
  mosquitto-data:
