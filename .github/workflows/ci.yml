name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
        timeout-minutes: 3
      - name: Test deployment command boundary
        run: python3 scripts/deploy/test_deploy.py
  container-build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix: { component: [api, web] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./${{ matrix.component }}/Dockerfile
          push: false
  publish:
    needs: [verify, container-build]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'rchmdndy/kinan_works' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: { component: [api, web] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve image identity
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          printf 'owner=%s\n' "${OWNER,,}" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/kinan_works-${{ matrix.component }}:sha-${{ steps.image.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'rchmdndy/kinan_works'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      actions: read
    with:
      revision: ${{ github.sha }}
    secrets: inherit
